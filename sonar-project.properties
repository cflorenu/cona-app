# SonarQube / SonarCloud: ejecutar tras `npm run test:ci` para que exista el informe lcov.
# Credenciales por variables de entorno: SONAR_HOST_URL y SONAR_TOKEN (nunca en este archivo).
sonar.projectKey=cona-app
sonar.projectName=Con Atletas Sur - cona-app
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/assets/**,**/testing/**,**/data/demo-*.ts
sonar.coverage.exclusions=src/environments/**,src/main.ts,src/main.server.ts,src/app/app.config.server.ts

sonar.javascript.lcov.reportPaths=coverage/cona-app/lcov.info
sonar.eslint.reportPaths=eslint-report.json
