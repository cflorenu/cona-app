<header class="site-header">
  <nav class="nav" aria-label="Navegación principal">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Con Atletas Sur, ir al inicio">
      <img ngSrc="assets/cona_logo.png" width="44" height="44" loading="eager" alt="" class="brand__logo">
      <span class="brand__name" aria-hidden="true"><span class="brand__con">Con</span> Atletas</span>
    </a>

    <button type="button" class="burger" (click)="toggleMenu()" aria-controls="menu-principal"
      [attr.aria-expanded]="isMenuOpen()" aria-label="Abrir o cerrar el menú">
      <span></span><span></span><span></span>
    </button>

    <div id="menu-principal" class="menu" [class.menu--open]="isMenuOpen()">
      <ul class="menu__links">
        @for (link of links; track link.path) {
          <li>
            <a class="menu__link" [routerLink]="link.path" [appPrefetch]="link.path" routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.exact ?? false }" ariaCurrentWhenActive="page"
              (click)="closeMenu()">{{ link.label }}</a>
          </li>
        }
      </ul>

      <div class="menu__actions">
        <a class="pill pill--secondary" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
          <app-icon name="whatsapp" /> Escríbenos
        </a>
        <button type="button" class="pill pill--primary" (click)="openFreeClass()">Clase gratis</button>
      </div>
    </div>
  </nav>
</header>
